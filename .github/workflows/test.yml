name: Lint and Test

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - pyproject.toml
      - .github/workflows/test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60
        with:
          version: "1.16.5"

      - name: Lint
        run: hatch run lint:all

  test:
    name: Test (Python ${{ matrix.python-version }}, PyMilvus ${{ matrix.pymilvus-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            pymilvus-version: "3.0.*"
          - python-version: "3.10"
            pymilvus-version: "2.5.*"
          - python-version: "3.10"
            pymilvus-version: "2.6.*"
          - python-version: "3.10"
            pymilvus-version: "3.0.*"
          - python-version: "3.11"
            pymilvus-version: "3.0.*"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60
        with:
          version: "1.16.5"

      - name: Pin pymilvus ${{ matrix.pymilvus-version }}
        run: hatch run pip install "pymilvus==${{ matrix.pymilvus-version }}"

      - name: Run Milvus
        run: |
          wget https://raw.githubusercontent.com/milvus-io/milvus/master/scripts/standalone_embed.sh
          bash standalone_embed.sh start
          sleep 5
          echo "\nMilvus server started!"

      - name: Run tests
        run: hatch run cov

      - name: Stop and Remove Milvus
        if: always()
        run: |
          bash standalone_embed.sh stop
          echo "\nMilvus server stopped and removed!"
